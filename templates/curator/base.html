{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="{% static 'images/favicon.ico' %}" sizes="16x16 32x32 48x48">
  <link rel="icon" href="{% static 'images/favicon-32.png' %}" type="image/png" sizes="32x32">
  <link rel="icon" href="{% static 'images/favicon.svg' %}" type="image/svg+xml" sizes="any">
  <link rel="apple-touch-icon" href="{% static 'images/apple-touch-icon.png' %}" sizes="180x180">
  <title>{% block page_title %}{{ curator_ui.login_heading }}{% endblock %} · {{ curator_ui.product }}</title>
  <style>
    {% include 'curator/oasis_tokens.css' %}
    {% include 'curator/account_style.css' %}
  </style>
</head>
<body class="curator-account">
  <header class="curator-topbar"><div class="curator-topbar-inner"><div class="curator-brand"><img src="{% static 'images/kuwala-oasis.svg' %}" alt="" aria-hidden="true" width="40" height="40"><strong>{{ curator_ui.product }}</strong></div></div></header>
  <main class="curator-account-main">{% block content %}{% endblock %}</main>
</body>
</html>

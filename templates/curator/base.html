{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="{% static 'images/favicon.ico' %}" sizes="16x16 32x32 48x48">
  <link rel="icon" href="{% static 'images/favicon-32.png' %}" type="image/png" sizes="32x32">
  <link rel="icon" href="{% static 'images/favicon.svg' %}" type="image/svg+xml" sizes="any">
  <link rel="apple-touch-icon" href="{% static 'images/apple-touch-icon.png' %}" sizes="180x180">
  <title>{{ curator_ui.login_heading }} · {{ curator_ui.product }}</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#fff;color:#123c5b;font:18px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{border-bottom:1px solid #c8d7e2;padding:20px max(20px,calc((100vw - 1080px)/2))}header strong{font-size:24px}main{max-width:560px;margin:48px auto;padding:0 20px 40px}h1{font-size:32px;line-height:1.2;margin:0 0 16px}p{margin:0 0 24px}.note{font-size:16px;color:#38576d}label{display:block;font-weight:650;margin:20px 0 8px}input{display:block;width:100%;min-height:48px;padding:10px 12px;color:#123c5b;background:#fff;border:2px solid #5a7587;border-radius:6px;font:inherit}button,.button{display:inline-flex;align-items:center;justify-content:center;min-height:48px;margin-top:24px;padding:10px 20px;border:2px solid #075b94;border-radius:6px;background:#075b94;color:#fff;font:inherit;font-weight:650;text-decoration:none;cursor:pointer}a{color:#075b94;text-underline-offset:3px}a:focus-visible,input:focus-visible,button:focus-visible{outline:3px solid #075b94;outline-offset:4px}.errorlist{color:#8b1f28;padding-left:24px}.helptext{display:block;margin-top:8px;font-size:16px}.helptext ul{padding-left:24px}@media(max-width:600px){main{margin-top:32px}h1{font-size:28px}button,.button{width:100%}}
  </style>
  <style>
    .curator-brand{display:flex;align-items:center;gap:12px}.curator-brand img{display:block;flex:none;width:40px;height:40px;padding:6px;border-radius:10px;background:#343330;object-fit:contain}@media(max-width:600px){.curator-brand img{width:32px;height:32px;padding:4px;border-radius:8px}}
  </style>
</head>
<body>
  <header><div class="curator-brand"><img src="{% static 'images/kuwala-oasis.svg' %}" alt="" aria-hidden="true" width="40" height="40"><strong>{{ curator_ui.product }}</strong></div></header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>

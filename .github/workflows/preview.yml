name: Oasis Library preview
on:
  pull_request:
  push:
    branches: [master, main, codex/oasis-library-rebrand]
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-preview.lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements-preview.lock.txt
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: npm run build-prod
        working-directory: frontend
      - run: python scripts/preview.py prepare
      - run: python scripts/preview.py check
      - run: python scripts/preview.py test

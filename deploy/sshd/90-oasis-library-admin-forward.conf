# Install as /etc/ssh/sshd_config.d/90-oasis-library-admin-forward.conf.
# Validate the complete sshd configuration and effective Match settings before
# reloading SSH. This account serves only the dedicated Pi manager tunnel.
Match User oasis-curator-forward
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AuthorizedKeysFile /etc/ssh/authorized_keys/%u
    ForceCommand /usr/bin/false
    MaxSessions 0
    PermitTTY no
    PermitUserRC no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTunnel no
    AllowTcpForwarding local
    PermitOpen 127.0.0.1:8790
    PermitListen none
    AllowStreamLocalForwarding no
Match all
